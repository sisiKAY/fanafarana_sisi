name: Build Fanafarana Sisi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Clean App Architecture
        run: |
          rm -rf *
          flutter create . --org com.fanafarana.sisi --project-name fanafarana_sisi
          flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fanafarana_Sisi_APK
          path: build/app/outputs/flutter-apk/app-release.apk
